services:
  api:
    build: .
    env_file: .env
    environment:
      AUTO_CREATE_TABLES: "false"   # esquema gerenciado pelo Alembic (executado no start da API)
    ports: ["8000:8000"]
    depends_on: [postgres, redis]

  worker:
    build: .
    env_file: .env
    environment:
      AUTO_CREATE_TABLES: "false"
    command: python -m app.workers.email_worker
    depends_on: [api]

  redis:
    image: redis:7-alpine

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notif
      POSTGRES_PASSWORD: notif
      POSTGRES_DB: notifications
    volumes: [pgdata:/var/lib/postgresql/data]

volumes:
  pgdata:
